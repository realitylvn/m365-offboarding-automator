# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: m365-offboarding-automator

hooks:
  postprovision:
    shell: pwsh
    run: ./scripts/publish-runbook.ps1 -ResourceGroupName $env:AZURE_RESOURCE_GROUP -AutomationAccountName $env:AUTOMATION_ACCOUNT_NAME
    interactive: false
    continueOnError: false
